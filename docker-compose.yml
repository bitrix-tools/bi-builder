#
# Bitrix24 BI Builder - On-Premise Docker Compose
#
# Before launch use README.
# Launch: docker compose up -d
#
networks:
  backend:
    internal: true
  frontend:
    name: ${BX_NETWORK_NAME:-bi_builder_frontend}
    external: ${BX_NETWORK_EXTERNAL:-false}

volumes:
  superset_home:
  mysql_data:
  redis_data:

services:
  nginx:
    image: nginx:1.30.4-alpine
    container_name: bi_builder_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_SUPERSET_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
      - /dev/shm:rw,noexec,nosuid,nodev
    pids_limit: ${NGINX_PIDS_LIMIT:-100}
    ulimits:
      nofile:
        soft: ${NGINX_NOFILE_SOFT:-1024}
        hard: ${NGINX_NOFILE_HARD:-2048}
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    cpus: ${NGINX_CPUS:-0.5}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
      - frontend
    depends_on:
      - superset
  redis:
    image: redis:8.2.9-alpine
    container_name: bi_builder_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /dev/shm:rw,noexec,nosuid,nodev
    pids_limit: ${REDIS_PIDS_LIMIT:-50}
    ulimits:
      nofile:
        soft: ${REDIS_NOFILE_SOFT:-1024}
        hard: ${REDIS_NOFILE_HARD:-2048}
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
  mysql:
    image: mysql:8.4.11-oracle
    container_name: bi_builder_mysql
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_DB}
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /run/mysqld:rw,noexec,nosuid,nodev
      - /dev/shm:rw,noexec,nosuid,nodev
    pids_limit: ${DATABASE_PIDS_LIMIT:-200}
    ulimits:
      nofile:
        soft: ${DATABASE_NOFILE_SOFT:-4096}
        hard: ${DATABASE_NOFILE_HARD:-8192}
    mem_limit: ${DATABASE_MEM_LIMIT:-1g}
    cpus: ${DATABASE_CPUS:-1.0}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  trino:
    image: quay.io/bitrix24/trino:478-v1-alpine
    container_name: bi_builder_trino
    restart: unless-stopped
    env_file:
      - .env
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /dev/shm:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev
      - /etc/trino:rw,noexec,nosuid,nodev,uid=1000,gid=1000
      - /var/trino:rw,noexec,nosuid,nodev,uid=1000,gid=1000
    pids_limit: ${TRINO_PIDS_LIMIT:-1000}
    ulimits:
      nofile:
        soft: ${TRINO_NOFILE_SOFT:-4096}
        hard: ${TRINO_NOFILE_HARD:-8192}
      nproc:
        soft: ${TRINO_NPROC_SOFT:-8192}
        hard: ${TRINO_NPROC_HARD:-8192}
    mem_limit: ${TRINO_MEM_LIMIT:-4g}
    cpus: ${TRINO_CPUS:-2.0}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
      - frontend
    depends_on:
      - redis
  superset:
    image: quay.io/bitrix24/superset:6.0.0-v900-debian
    # superset-init, superset-worker, superset-worker-beat
    container_name: bi_builder_superset
    command: ["/usr/bin/run-server.sh"]
    restart: unless-stopped
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${BI_BUILDER_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${BI_BUILDER_ADMIN_PASSWORD}
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /var/tmp:rw,noexec,nosuid,nodev
      - /dev/shm:rw,nosuid,nodev,mode=1777  # noexec was removed: celery/billiard reqiures exec for POSIX-semaphores in shm
      - /run:rw,noexec,nosuid,nodev
    pids_limit: ${SUPERSET_PIDS_LIMIT:-150}
    ulimits:
      nofile:
        soft: ${SUPERSET_NOFILE_SOFT:-1024}
        hard: ${SUPERSET_NOFILE_HARD:-2048}
    mem_limit: ${SUPERSET_MEM_LIMIT:-2g}
    cpus: ${SUPERSET_CPUS:-1.0}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      backend:
      frontend:
        aliases:
          - ${SUPERSET_URL_ALIAS:-superset.bi.local.bx}
    depends_on:
      superset-init:
        condition: service_completed_successfully
  superset-init:
    image: quay.io/bitrix24/superset:6.0.0-v900-debian
    container_name: bi_builder_superset_init
    command: [ "/bin/bash", "/app/docker/docker-init.sh" ]
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker-init.sh:/app/docker/docker-init.sh:ro
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${BI_BUILDER_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${BI_BUILDER_ADMIN_PASSWORD}
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /var/tmp:rw,noexec,nosuid,nodev
      - /dev/shm:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev
    pids_limit: ${SUPERSET_PIDS_LIMIT:-150}
    ulimits:
      nofile:
        soft: ${SUPERSET_NOFILE_SOFT:-1024}
        hard: ${SUPERSET_NOFILE_HARD:-2048}
    mem_limit: ${SUPERSET_MEM_LIMIT:-2g}
    cpus: ${SUPERSET_CPUS:-1.0}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      trino:
        condition: service_started
    healthcheck:
      disable: true
  superset-worker:
    image: quay.io/bitrix24/superset:6.0.0-v900-debian
    container_name: bi_builder_superset_worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "-O", "fair", "-l", "INFO", "--concurrency=2"]
    restart: unless-stopped
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${BI_BUILDER_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${BI_BUILDER_ADMIN_PASSWORD}
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /var/tmp:rw,noexec,nosuid,nodev
      - /dev/shm:rw,nosuid,nodev,mode=1777  # noexec was removed: celery/billiard reqiures exec for POSIX-semaphores in shm
      - /run:rw,noexec,nosuid,nodev
    pids_limit: ${SUPERSET_PIDS_LIMIT:-150}
    ulimits:
      nofile:
        soft: ${SUPERSET_NOFILE_SOFT:-1024}
        hard: ${SUPERSET_NOFILE_HARD:-2048}
    mem_limit: ${SUPERSET_MEM_LIMIT:-2g}
    cpus: ${SUPERSET_CPUS:-1.0}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
  superset-worker-beat:
    image: quay.io/bitrix24/superset:6.0.0-v900-debian
    container_name: bi_builder_superset_beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile", "/tmp/celerybeat.pid", "-l", "INFO", "-s", "/app/superset_home/celerybeat-schedule"]
    restart: unless-stopped
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${BI_BUILDER_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${BI_BUILDER_ADMIN_PASSWORD}
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=65536k
      - /var/tmp:rw,noexec,nosuid,nodev
      - /dev/shm:rw,nosuid,nodev,mode=1777  # noexec was removed: celery/billiard reqiures exec for POSIX-semaphores in shm
      - /run:rw,noexec,nosuid,nodev
    pids_limit: ${SUPERSET_PIDS_LIMIT:-150}
    ulimits:
      nofile:
        soft: ${SUPERSET_NOFILE_SOFT:-1024}
        hard: ${SUPERSET_NOFILE_HARD:-2048}
    mem_limit: ${SUPERSET_MEM_LIMIT:-2g}
    cpus: ${SUPERSET_CPUS:-1.0}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-256m}"
        max-file: "${LOG_MAX_FILE:-7}"
        compress: "true"
    networks:
      - backend
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

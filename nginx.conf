#
# Bitrix24 BI Builder — On-Premise Configuration
#

#
# Upstreams
#
upstream superset_app {
    server superset:8088;
    keepalive 100;
}

upstream trino_backend {
    server trino:8080;
    keepalive 100;
}

#
# Trino HTTPS (port 443, internal)
# Used by Superset for connect to Trino via SSL.
# Matched only for the internal hostname `nginx`
# (Superset connects to https://nginx:443).
#
server {
    listen 443 ssl;
    listen [::]:443 ssl;
	http2 on;
    server_name nginx;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256";
    ssl_ecdh_curve prime256v1:secp384r1:secp521r1:X25519;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 4k;
    ssl_stapling off;
    ssl_stapling_verify off;

    keepalive_timeout 70;
    keepalive_requests 1000;
    client_max_body_size 64m;
    large_client_header_buffers 4 64k;

    # trino
    location / {
        proxy_pass http://trino_backend;
        proxy_redirect http:// https://;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

#
# Superset HTTPS (port 443, external)
# Main entry point for users (default server)
#
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
	http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256";
    ssl_ecdh_curve prime256v1:secp384r1:secp521r1:X25519;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 4k;
    ssl_stapling off;
    ssl_stapling_verify off;

    keepalive_timeout 70;
    keepalive_requests 1000;
    client_max_body_size 64m;
	large_client_header_buffers 4 64k;

    # superset
    location / {
        proxy_pass http://superset_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
